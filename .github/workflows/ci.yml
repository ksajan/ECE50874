# CI: run backend tests, frontend tests, and E2E tests on push/PR.
name: CI

on:
  push:
    branches: [main, master, FRONTEND, feat/*]
  pull_request:
    branches: [main, master, FRONTEND]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        run: |
          cd services/backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend unit tests
        run: |
          cd services/backend
          python -m pytest tests/ -v
        env:
          APP_ENV: development

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd services/frontend
          npm ci

      - name: Run frontend unit tests
        run: |
          cd services/frontend
          npm run test:run

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bbg
          POSTGRES_PASSWORD: bbg_test
          POSTGRES_DB: bbg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd services/backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed database
        run: |
          cd services/backend
          python scripts/setup_db.py
        env:
          DATABASE_URL: postgresql://bbg:bbg_test@localhost:5432/bbg_test

      - name: Start backend server
        run: |
          cd services/backend
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 3
        env:
          DATABASE_URL: postgresql://bbg:bbg_test@localhost:5432/bbg_test
          APP_ENV: development

      - name: Install frontend dependencies
        run: |
          cd services/frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd services/frontend
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          cd services/frontend
          npx playwright test
        env:
          CI: true
